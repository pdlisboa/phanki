name: Release

# Publishes on every merge to main, or manually (Actions > Release > Run workflow).
# The version is the latest v* tag bumped by "bump" (patch for merges).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  version:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      code: ${{ steps.next.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            case "${{ inputs.bump || 'patch' }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Android versionCode must only grow; the run number does.
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: APP_VERSION=v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web
        run: npm run build -w @phanki/web
        env:
          APP_VERSION: v${{ needs.version.outputs.version }}
          VITE_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
      - run: npx cap sync android
        working-directory: apps/web
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 não configurado: o APK sai com chave de debug e atualizações exigirão desinstalar o app."
          fi
      - name: Build APK
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - run: mv apps/web/android/app/build/outputs/apk/release/app-release.apk "phanki-v$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: phanki-v*.apk

  publish:
    needs: [version, docker, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Phanki v${{ needs.version.outputs.version }}
          files: phanki-v*.apk
          generate_release_notes: true
          make_latest: true
